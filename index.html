    <div class="test-form-row"><label for="testLang">测试语言</label><select id="testLang"><option value="auto">按接收人语言</option><option value="zh-CN">简体中文</option><option value="en">English</option><option value="id">Bahasa Indonesia</option><option value="vi">Tiếng Việt</option><option value="ar">العربية</option></select></div>
    <div id="testSendError" class="test-error" hidden></div>
    <div class="confirm-btns"><button id="testCancel" class="btn">取消</button><button id="testConfirm" class="btn btn-primary">确认测试发送</button></div>
    </section>`;
  document.body.append(dialog);
  const close=()=>dialog.remove();
  $('#testCancel',dialog).onclick=close;
  dialog.addEventListener('click',e=>{if(e.target===dialog)close()});
  $('#testReceiver',dialog).focus();
  $('#testConfirm',dialog).onclick=async()=>{
    const receiverId=$('#testReceiver',dialog).value.trim(),locale=$('#testLang',dialog).value;
    const error=$('#testSendError',dialog),button=$('#testConfirm',dialog);
    if(!receiverId){error.hidden=false;error.textContent='请输入测试接收人 ID';return}
    if(!/^[\w.-]{1,64}$/.test(receiverId)){error.hidden=false;error.textContent='接收人 ID 只能包含数字、英文字母、下划线、点和短横线';return}
    button.disabled=true;button.textContent='发送中…';error.hidden=true;
    try{
      const response=await fetch('/api/pk-notification/test-send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pkId,notifyKey:key,recipientId:receiverId,locale}),cache:'no-store'});
      const raw=await response.text();let result=null;try{result=JSON.parse(raw)}catch{}
      if(!response.ok||!result||result.success!==true||!result.messageId)throw new Error(response.status===404||response.status===405||!result?'测试发送接口暂不可用，请联系开发人员接入消息服务':result?.message||'消息推送失败，请检查接收人 ID 和消息配置');
      close();toast('测试消息已发送（消息 ID：'+result.messageId+'）');
    }catch(e){error.hidden=false;error.textContent=e instanceof TypeError?'测试发送接口暂不可用，请联系开发人员确认消息服务':e.message||'测试发送失败，请稍后重试'}
    finally{if(dialog.isConnected){button.disabled=false;button.textContent='确认测试发送'}}
  };
}
function showForm(mode,row){
  modalMode=mode;editId=row?.id||null;
  const root=$('#modalRoot');
   const locked=Boolean(row?.notifyEnabled&&['已完成','已过期'].includes(noticeState(row))&&sentCount(row)>0);
  const enabled=Boolean(row?.notifyEnabled);
  const datetime=String(row?.notifyAt||'').replace(' ','T');
  root.innerHTML=`<div class="overlay" id="modalOverlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <div class="dialog-header"><h2 id="dialogTitle">${mode==='add'?'添加':'编辑'}官方PK活动</h2><div class="dialog-header-actions"><button id="maximizeDialog" title="最大化" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 9V3h6m6 0h6v6M3 15v6h6m6 0h6v-6"/></svg></button><button id="closeDialog" title="关闭" type="button"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4 20 20M20 4 4 20"/></svg></button></div></div>
    <form id="pkForm" class="dialog-body" novalidate>
      <div class="form-row"><label for="fieldName"><span class="required">*</span>名称</label><input id="fieldName" class="modal-field" placeholder="请输入配置名称" maxlength="100" autocomplete="off" value="${escapeHtml(row?.name||'')}" /></div>
      <div class="form-row"><label for="fieldType"><span class="required">*</span>pk类型</label><div class="modal-select-wrap"><select id="fieldType" class="modal-field modal-select"><option value="">请选择</option>${['区域','跨国','全服'].map(x=>`<option ${row?.type===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
      <div class="form-row"><label for="fieldMode"><span class="required">*</span>pk模式</label><div class="modal-select-wrap"><select id="fieldMode" class="modal-field modal-select"><option value="">请选择</option>${['单人','双人','多人'].map(x=>`<option ${row?.mode===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
      <div class="form-row"><label><span class="required">*</span>活动时间</label><div class="date-control modal-date">${dateIcon}<input aria-label="活动开始日期" type="text" id="fieldStart" placeholder="开始日期" value="${escapeHtml(row?.start||'')}"/><span class="date-to">至</span><input aria-label="活动结束日期" id="fieldEnd" type="text" placeholder="结束日期" value="${escapeHtml(row?.end||'')}"/></div></div>
      <div class="notify-panel">
        <h3 class="notify-heading">代理消息通知 <small>可配置推送频次</small></h3>
        <div class="form-row notify-switch-row"><label for="notifyEnabled">代理通知</label><div class="notify-switch-wrap"><label class="notify-switch-label" title="${locked?'消息已发送，不能再次安排推送':'开启或关闭当前活动的代理通知'}"><input id="notifyEnabled" type="checkbox" role="switch" aria-label="代理消息通知开关" ${enabled?'checked':''} ${locked?'disabled':''}/><span class="notify-switch-track"></span></label><span class="notify-switch-word" id="notifySwitchText">${enabled?'开启':'关闭'}</span><span class="notify-hint" id="notifySwitchHint">${locked?'已推送，通知配置已锁定':enabled?'请完善多语言 Key 和推送时间':'默认关闭，不发送代理提醒'}</span></div></div>
        <div id="notifyExtra" class="notify-extra" ${enabled?'':'hidden'}>
          <div class="form-row"><label for="notifyKey"><span class="required">*</span>多语言 Key</label><input id="notifyKey" type="text" class="modal-field" placeholder="请输入多语言 Key，如 pk_agent_reminder" autocomplete="off" maxlength="200" value="${escapeHtml(row?.notifyKey||'')}" ${locked?'disabled':''}/></div>
          <p class="notify-help">仅填写一个多语言 Key，对应一段通知文字，无需区分标题和正文。</p>
          <div class="form-row"><label for="notifyFrequency"><span class="required">*</span>推送频次</label><select id="notifyFrequency" class="notify-form-select" ${locked?'disabled':''}>
            <option value="once" ${frequency(row)==='once'?'selected':''}>仅推送一次</option>
            <option value="daily" ${frequency(row)==='daily'?'selected':''}>每日一次</option>
            <option value="custom" ${frequency(row)==='custom'?'selected':''}>自定义间隔</option>
          </select></div>
          <div class="form-row" id="notifyIntervalRow" ${frequency(row)==='custom'?'':'hidden'}><label for="notifyIntervalHours"><span class="required">*</span>推送间隔</label><div class="notify-interval-inline"><input id="notifyIntervalHours" type="number" min="6" max="720" step="1" class="modal-field" placeholder="6～720" value="${escapeHtml(row?.notifyIntervalHours||6)}" ${locked?'disabled':''}/><span class="interval-unit">小时（最少 6 小时）</span></div></div>
          <div class="form-row"><label for="notifyAt"><span class="required">*</span>首次推送时间</label><input id="notifyAt" type="datetime-local" class="modal-field notify-date-input" aria-label="代理提醒首次推送时间（北京时间）" value="${escapeHtml(datetime)}" step="60" ${locked?'disabled':''}/></div>
          <p class="notify-help">北京时间（UTC+8），精确到分钟；重复推送持续到活动结束时间。</p>
        </div>
      </div>
      <div id="formError" class="form-error" hidden></div>
    </form>
    <div class="dialog-footer"><button class="btn btn-test" type="button" id="testSendBtn" ${enabled?'':'hidden'}>测试发送</button><button class="btn" type="button" id="cancelDialog">取消</button><button class="btn btn-primary" type="submit" form="pkForm">执行导入</button></div>
  </section></div>`;
  attachDatePickers($('#pkForm'));
  const close=()=>{root.innerHTML='';modalMode=null};
  $('#closeDialog').onclick=close;$('#cancelDialog').onclick=close;
  $('#maximizeDialog').onclick=()=>$('.dialog').classList.toggle('full-screen');
  $('#modalOverlay').addEventListener('click',e=>{if(e.target.id==='modalOverlay')close()});
  const toggle=$('#notifyEnabled');
  toggle.addEventListener('change',()=>{const active=toggle.checked;$('#notifyExtra').hidden=!active;$('#testSendBtn').hidden=!active;$('#notifySwitchText').textContent=active?'开启':'关闭';$('#notifySwitchHint').textContent=active?'按照配置的推送时间与频次发送':'默认关闭，不发送代理提醒';$('#formError').hidden=true});
   const freqSelect=$('#notifyFrequency');
   freqSelect.addEventListener('change',()=>{$('#notifyIntervalRow').hidden=freqSelect.value!=='custom';$('#formError').hidden=true});
   $('#testSendBtn').addEventListener('click',()=>showTestSendDialog($('#notifyKey').value.trim(),row?.id||null));
  $('#pkForm').addEventListener('submit',e=>{
    e.preventDefault();
    const name=$('#fieldName').value.trim(),type=$('#fieldType').value,modeVal=$('#fieldMode').value;
    const start=$('#fieldStart').value.trim().replace('T',' '),end=$('#fieldEnd').value.trim().replace('T',' ');
    const notifyEnabled=locked?enabled:toggle.checked;
    const notifyKey=locked?String(row?.notifyKey||''):$('#notifyKey').value.trim();
    const notifyAt=locked?String(row?.notifyAt||''):$('#notifyAt').value.replace('T',' ');
     const notifyFrequency=locked?frequency(row):$('#notifyFrequency').value;
     const notifyIntervalHours=notifyFrequency==='custom'?Number(locked?row?.notifyIntervalHours:$('#notifyIntervalHours').value):null;
    let err=!name?'请输入名称':!type?'请选择pk类型':!modeVal?'请选择pk模式':!validMinute(start)||!validMinute(end)?'请选择正确的活动时间（精确到分钟）':parseBeijing(start)>parseBeijing(end)?'活动开始时间不能晚于结束时间':'';
    if(!err&&notifyEnabled&&!locked){
      const frequencyChanged=notifyFrequency!==frequency(row)||notifyIntervalHours!==(frequency(row)==='custom'?Number(row?.notifyIntervalHours):null);
       const firstTimeSame=mode==='edit'&&row?.notifyEnabled&&row?.notifyAt===notifyAt&&row?.notifyKey===notifyKey;
       err=!notifyKey?'请输入多语言 Key':!notifyAt?'请选择首次推送时间':!['once','daily','custom'].includes(notifyFrequency)?'请选择推送频次':notifyFrequency==='custom'&&(!Number.isInteger(notifyIntervalHours)||notifyIntervalHours<6||notifyIntervalHours>720)?'推送间隔必须是 6～720 的整数小时':!validMinute(notifyAt)?'推送时间格式不正确':(parseBeijing(notifyAt)<=new Date()&&!firstTimeSame)?'首次推送时间必须晚于当前时间':parseBeijing(notifyAt)>parseBeijing(end)?'首次推送时间不能晚于活动结束时间':(sentCount(row)>0&&notifyAt!==row.notifyAt)?'已有推送记录，首次推送时间不可修改':(sentCount(row)>0&&frequencyChanged&&notifyFrequency==='once')?'已执行过推送，不能切换为仅一次':'';
    }
    if(err){$('#formError').hidden=false;$('#formError').textContent=err;$('#formError').scrollIntoView({block:'nearest',behavior:'smooth'});toast(err,true);return}
    let data={name,type,mode:modeVal,start,end};
    if(!locked){
      data.notifyEnabled=notifyEnabled;
      data.notifyKey=notifyKey||String(row?.notifyKey||'');
      data.notifyAt=notifyAt||String(row?.notifyAt||'');
       data.notifyFrequency=notifyFrequency;
       data.notifyIntervalHours=notifyFrequency==='custom'?notifyIntervalHours:null;
       data.notifySentCount=sentCount(row);
       data.notifyStatus=notifyEnabled?(row?.notifyStatus==='failed'?'failed':sentCount(row)>0?'sent':'pending'):'off';
    }
    if(mode==='edit'){
      const item=rows.find(r=>r.id===row.id);
      if(!item){toast('活动不存在或已删除',true);return}
      Object.assign(item,data);
      toast('活动修改成功');
    }else{
      rows.unshift({id:Math.max(0,...rows.map(r=>r.id))+1,...data});
      toast('新增PK活动成功');
    }
    save();close();activeFilters={};currentPage=1;
    $$('#searchId,#searchName,#searchType,#searchMode,#searchStatus,#searchNotice,#searchStart,#searchEnd').forEach(el=>el.value='');
    render();
  });
}
$('#addBtn').addEventListener('click',()=>showForm('add'));
function showDelete(row){const root=$('#modalRoot');root.innerHTML=`<div class="overlay" id="modalOverlay"><div class="confirm-dialog" role="alertdialog" aria-modal="true"><h3 class="confirm-title">删除确认</h3><div class="confirm-text"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#e6a23c" stroke-width="2"><path d="M12 3 2 21h20zM12 9v5m0 3v2"/></svg><span>确定删除活动「${escapeHtml(row.name)}」（ID：${row.id}）吗？删除后无法恢复。</span></div><div class="confirm-btns"><button id="cancelDelete" class="btn">取消</button><button id="confirmDelete" class="btn btn-red">确定删除</button></div></div></div>`;$('#cancelDelete').onclick=()=>root.innerHTML='';$('#confirmDelete').onclick=()=>{rows=rows.filter(r=>r.id!==row.id);save();root.innerHTML='';render();toast('已删除活动')};$('#modalOverlay').onclick=e=>{if(e.target.id==='modalOverlay')root.innerHTML=''}}
function showGroups(row){let groups=row.groups||[];const root=$('#modalRoot');function draw(){root.innerHTML=`<div class="overlay" id="modalOverlay"><section class="dialog group-dialog" role="dialog" aria-modal="true"><div class="dialog-header"><h2 style="font-size:18px">PK分组管理</h2><div class="dialog-header-actions"><button id="closeGroups" aria-label="关闭">✕</button></div></div><div class="dialog-body"><div class="group-summary">活动：${escapeHtml(row.name)}　　活动ID：${row.id}　　分组数量：${groups.length}</div>${groups.length?`<div class="group-list">${groups.map((g,i)=>`<div class="group-card"><div><strong>第 ${i+1} 组</strong><div class="small">${escapeHtml(g)}</div></div><button class="btn btn-red" data-delgroup="${i}">删除分组</button></div>`).join('')}</div>`:'<div class="group-empty">暂无分组，请点击下方「新增分组」</div>'}<div style="display:flex;gap:10px;margin-top:20px"><input id="groupName" class="text-control" placeholder="请输入分组名称" style="width:100%;height:34px"><button id="addGroup" class="btn btn-primary" style="height:34px">新增分组</button></div></div><div class="dialog-footer" style="height:70px"><button id="doneGroups" class="btn btn-primary">完成</button></div></section></div>`;const close=()=>root.innerHTML='';$('#closeGroups').onclick=close;$('#doneGroups').onclick=close;$('#modalOverlay').onclick=e=>{if(e.target.id==='modalOverlay')close()};$('#addGroup').onclick=()=>{let value=$('#groupName').value.trim();if(!value)return toast('请输入分组名称',true);groups.push(value);row.groups=groups;save();draw();toast('分组添加成功')};$$('[data-delgroup]').forEach(el=>el.onclick=()=>{groups.splice(Number(el.dataset.delgroup),1);row.groups=groups;save();draw();toast('已删除分组')});$('#groupName').onkeydown=e=>{if(e.key==='Enter')$('#addGroup').click()}}draw()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modalRoot').innerHTML)$('#modalRoot').innerHTML=''}});
render();
})();
</script>
